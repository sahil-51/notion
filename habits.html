<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Habit Matrix - Mobile First</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
    
    <style>
        :root {
            --bg-color: #ffffff; 
            --card-bg: #fbfbfa;   
            --border-color: #e9e9e6;
            --text-main: #37352f; 
            --text-sub: #787774;  
            --accent-color: #4a5568; 
            --progress-empty: #e9e9e6;
            --progress-filled: #2a9d8f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Better for mobile embedding */
            min-height: 100vh;
            margin: 0;
            padding: 8px; /* Tighter spacing for phone screens */
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px; /* Reduced padding to save screen estate */
            box-shadow: 0 4px 20px rgba(74, 85, 104, 0.03);
            width: 100%;
            max-width: 340px; /* Perfect sweet-spot for phone layouts */
            box-sizing: border-box;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-sub);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: #e9e9e6;
            color: var(--text-main);
        }

        .tab-btn.disabled {
            opacity: 0.3;
        }

        .day-indicator {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .progress-zone {
            margin-bottom: 16px;
        }

        .percentage {
            font-size: 2.4rem; /* Slightly smaller for mobile scaling consistency */
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -1px;
        }

        .bar-bg {
            background: var(--progress-empty);
            border-radius: 10px;
            height: 6px;
            width: 100%;
            overflow: hidden;
        }

        .bar-fill {
            background: var(--progress-filled);
            height: 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .habit-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 2px;
        }

        .habit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .habit-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0; /* Prevents long text from breaking mobile boundaries */
        }

        .habit-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--progress-filled);
            flex-shrink: 0; /* Prevents checkbox from squeezing */
        }

        .habit-details {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .habit-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Gracefully shortens super long habit names */
        }

        .habit-text.completed {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .habit-days-badge {
            font-size: 0.65rem;
            color: var(--text-sub);
            margin-top: 1px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #eb5757;
            font-weight: 800;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 4px;
            flex-shrink: 0;
        }

        /* Fluid Mobile Grid Input Form */
        .add-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 12px;
        }

        .add-panel {
            display: flex;
            gap: 6px;
        }

        .add-input {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            outline: none;
            color: var(--text-main);
            min-width: 0;
        }

        .add-btn {
            background-color: var(--text-main);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 0 12px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .week-selector {
            display: flex;
            justify-content: space-between;
            gap: 2px; /* Super tight gap so it never wraps lines */
        }

        .day-checkbox-label {
            flex: 1;
            text-align: center;
        }

        .day-checkbox-label input {
            display: none;
        }

        .day-box {
            display: block;
            font-size: 0.65rem; /* Compact font for phone screens */
            font-weight: 700;
            color: var(--text-sub);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 5px 0;
            border-radius: 4px;
            user-select: none;
        }

        .day-checkbox-label input:checked + .day-box {
            background-color: var(--text-main);
            color: #ffffff;
            border-color: var(--text-main);
        }

        .empty-state {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-align: center;
            margin: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="nav-tabs">
            <button class="tab-btn active">⚔️ Combat</button>
            <button class="tab-btn disabled">📊 Analytics</button>
        </div>

        <div class="day-indicator" id="current-day-label">Loading day...</div>
        
        <div class="progress-zone">
            <div class="percentage" id="progress-percent">0%</div>
            <div class="bar-bg">
                <div class="bar-fill" id="progress-bar"></div>
            </div>
        </div>

        <div class="habit-list" id="habit-container"></div>

        <div class="add-container">
            <div class="add-panel">
                <input type="text" class="add-input" id="habit-input" placeholder="New routine..." maxlength="18">
                <button class="add-btn" onclick="addHabit()">Add</button>
            </div>
            
            <div class="week-selector">
                <label class="day-checkbox-label"><input type="checkbox" value="Su" checked><span class="day-box">Su</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="Mo" checked><span class="day-box">Mo</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="Tu" checked><span class="day-box">Tu</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="We" checked><span class="day-box">We</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="Th" checked><span class="day-box">Th</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="Fr" checked><span class="day-box">Fr</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="Sa" checked><span class="day-box">Sa</span></label>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const dayNames = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
        const fullDayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        
        const currentDayIndex = new Date().getDay();
        const currentDayName = dayNames[currentDayIndex];
        
        document.getElementById('current-day-label').innerText = `📅 ${fullDayNames[currentDayIndex]}`;

        let habits = JSON.parse(localStorage.getItem('dashboard_habits_mobile_v1')) || [
            { id: 1, text: "Coding Practice", completed: false, days: ["Mo", "Tu", "We", "Th", "Fr"] },
            { id: 2, text: "Weekly Grocery Run", completed: false, days: ["Sa", "Su"] }
        ];

        const container = document.getElementById('habit-container');
        const percentEl = document.getElementById('progress-percent');
        const barEl = document.getElementById('progress-bar');
        const inputEl = document.getElementById('habit-input');

        function saveAndRender() {
            localStorage.setItem('dashboard_habits_mobile_v1', JSON.stringify(habits));
            renderHabits();
        }

        function renderHabits() {
            container.innerHTML = '';
            const todaysHabits = habits.filter(h => h.days.includes(currentDayName));

            if (todaysHabits.length === 0) {
                container.innerHTML = `<div class="empty-state">🎉 Rest day! No habits scheduled.</div>`;
                percentEl.innerText = "100%";
                barEl.style.width = "100%";
                return;
            }

            let completedCount = 0;

            todaysHabits.forEach(habit => {
                if (habit.completed) completedCount++;

                const item = document.createElement('div');
                item.className = 'habit-item';
                item.innerHTML = `
                    <div class="habit-left" onclick="toggleHabit(${habit.id})">
                        <input type="checkbox" class="habit-checkbox" ${habit.completed ? 'checked' : ''} readonly>
                        <div class="habit-details">
                            <span class="habit-text ${habit.completed ? 'completed' : ''}">${habit.text}</span>
                            <span class="habit-days-badge">🗓️ ${habit.days.join(', ')}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteHabit(${habit.id})">×</button>
                `;
                container.appendChild(item);
            });

            const finalPercentage = Math.round((completedCount / todaysHabits.length) * 100);
            percentEl.innerText = `${finalPercentage}%`;
            barEl.style.width = `${finalPercentage}%`;

            if (finalPercentage === 100 && todaysHabits.length > 0) {
                confetti({ particleCount: 30, spread: 25, origin: { y: 0.85 } });
            }
        }

        function toggleHabit(id) {
            habits = habits.map(h => h.id === id ? { ...h, completed: !h.completed } : h);
            saveAndRender();
        }

        function addHabit() {
            const text = inputEl.value.trim();
            if (!text) return;

            const checkedDays = [];
            document.querySelectorAll('.week-selector input').forEach(box => {
                if (box.checked) checkedDays.push(box.value);
            });

            if (checkedDays.length === 0) {
                alert("Select at least one day!");
                return;
            }

            habits.push({ id: Date.now(), text: text, completed: false, days: checkedDays });
            inputEl.value = '';
            saveAndRender();
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveAndRender();
        }

        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addHabit();
        });

        renderHabits();
    </script>
</body>
</html>
