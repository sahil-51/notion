<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Habit Matrix - Boss Battle Edition</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
    
    <style>
        :root {
            --bg-color: #ffffff; 
            --card-bg: #fbfbfa;   
            --border-color: #e9e9e6;
            --text-main: #37352f; 
            --text-sub: #787774;  
            --accent-color: #4a5568; 
            --progress-empty: #e9e9e6;
            --progress-filled: #2a9d8f;
            --boss-hp: #eb5757;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(74, 85, 104, 0.03);
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
            position: relative;
        }

        /* Screen Shake Target Container */
        .battle-arena {
            transition: transform 0.1s ease-in-out;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-sub);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: #e9e9e6;
            color: var(--text-main);
        }

        .tab-btn.disabled {
            opacity: 0.3;
        }

        /* ⚔️ RPG Boss Battle Area Layout */
        .boss-container {
            background: #111111; /* Dark aesthetic for the boss zone */
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(235, 87, 87, 0.15);
            border: 1px solid #222;
        }

        .boss-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .boss-title {
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .boss-hp-text {
            color: var(--boss-hp);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .hp-bar-bg {
            background: #222222;
            border-radius: 6px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            border: 1px solid #333;
        }

        .hp-bar-fill {
            background: linear-gradient(90deg, #eb5757, #ff7b7b);
            height: 100%;
            width: 100%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .day-indicator {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .progress-zone {
            margin-bottom: 12px;
        }

        .percentage {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -1px;
        }

        .bar-bg {
            background: var(--progress-empty);
            border-radius: 10px;
            height: 6px;
            width: 100%;
            overflow: hidden;
        }

        .bar-fill {
            background: var(--progress-filled);
            height: 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .rating-zone {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rating-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .rating-row {
            display: flex;
            gap: 6px;
        }

        .rating-select {
            flex: 1;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        .log-day-btn {
            background-color: var(--progress-filled);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        .habit-list {
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 2px;
        }

        .habit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .habit-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .habit-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--progress-filled);
            flex-shrink: 0;
        }

        .habit-details {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .habit-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .habit-text.completed {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .habit-days-badge {
            font-size: 0.65rem;
            color: var(--text-sub);
            margin-top: 1px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #eb5757;
            font-weight: 800;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .add-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 12px;
        }

        .add-panel {
            display: flex;
            gap: 6px;
        }

        .add-input {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            outline: none;
            color: var(--text-main);
            min-width: 0;
        }

        .add-btn {
            background-color: var(--text-main);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 0 12px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .week-selector {
            display: flex;
            justify-content: space-between;
            gap: 2px;
        }

        .day-checkbox-label {
            flex: 1;
            text-align: center;
        }

        .day-checkbox-label input {
            display: none;
        }

        .day-box {
            display: block;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-sub);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 5px 0;
            border-radius: 4px;
            user-select: none;
        }

        .day-checkbox-label input:checked + .day-box {
            background-color: var(--text-main);
            color: #ffffff;
            border-color: var(--text-main);
        }

        .empty-state {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-align: center;
            margin: 20px 0;
            font-style: italic;
        }

        /* 🎬 RPG IMPACT SHAKE ANIMATION */
        @keyframes hitShake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(2px, -1px) rotate(1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(2px, 1px) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake-impact { animation: hitShake 0.15s ease-in-out standard; }
    </style>
</head>
<body>

    <div class="card" id="main-widget-card">
        <div class="nav-tabs">
            <button class="tab-btn active">⚔️ Combat</button>
            <button class="tab-btn disabled">📊 Analytics</button>
        </div>

        <!-- ⚔️ RPG COMBAT ARENA HUD -->
        <div class="boss-container">
            <div class="boss-meta">
                <span class="boss-title">👹 Sloth Titan [Lv.1]</span>
                <span class="boss-hp-text" id="hp-counter">HP: 100/100</span>
            </div>
            <div class="hp-bar-bg">
                <div class="hp-bar-fill" id="hp-bar"></div>
            </div>
        </div>

        <div class="day-indicator" id="current-day-label">Loading day...</div>
        
        <div class="progress-zone">
            <div class="percentage" id="progress-percent">0%</div>
            <div class="bar-bg">
                <div class="bar-fill" id="progress-bar"></div>
            </div>
        </div>

        <div class="rating-zone">
            <div class="rating-label">✨ Aaj ka din kaisa tha?</div>
            <div class="rating-row">
                <select class="rating-select" id="day-rating-dropdown">
                    <option value="ek-number">⭐ ek number din tha</option>
                    <option value="maaza">🔥 maaza hi agya</option>
                    <option value="thik">👍 thik thik</option>
                    <option value="kharab">👎 kharab</option>
                    <option value="bhul-jana">🌧️ bhul jana hi thik hai</option>
                </select>
                <button class="log-day-btn" onclick="logCurrentDay()">Log</button>
            </div>
        </div>

        <div class="habit-list" id="habit-container"></div>

        <div class="add-container">
            <div class="add-panel">
                <input type="text" class="add-input" id="habit-input" placeholder="New routine..." maxlength="18">
                <button class="add-btn" onclick="addHabit()">Add</button>
            </div>
            
            <div class="week-selector">
                <label class="day-checkbox-label"><input type="checkbox" value="Su" checked><span class="day-box">Su</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="Mo" checked><span class="day-box">Mo</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="Tu" checked><span class="day-box">Tu</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="We" checked><span class="day-box">We</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="Th" checked><span class="day-box">Th</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="Fr" checked><span class="day-box">Fr</span></label>
                <label class="day-checkbox-label"><input type="checkbox" value="Sa" checked><span class="day-box">Sa</span></label>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const dayNames = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
        const fullDayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        
        const currentDayIndex = new Date().getDay();
        const currentDayName = dayNames[currentDayIndex];
        
        document.getElementById('current-day-label').innerText = `📅 ${fullDayNames[currentDayIndex]}`;

        let habits = JSON.parse(localStorage.getItem('dashboard_habits_mobile_v1')) || [];
        let historyLogs = JSON.parse(localStorage.getItem('dashboard_history_v1')) || {};

        const cardEl = document.getElementById('main-widget-card');
        const container = document.getElementById('habit-container');
        const percentEl = document.getElementById('progress-percent');
        const barEl = document.getElementById('progress-bar');
        const hpBarEl = document.getElementById('hp-bar');
        const hpTextEl = document.getElementById('hp-counter');
        const inputEl = document.getElementById('habit-input');
        const ratingSelect = document.getElementById('day-rating-dropdown');

        function saveAndRender() {
            localStorage.setItem('dashboard_habits_mobile_v1', JSON.stringify(habits));
            renderHabits();
        }

        function triggerImpactAnimation() {
            cardEl.classList.remove('shake-impact');
            void cardEl.offsetWidth; // Force element re-flow trick to restart CSS animation
            cardEl.classList.add('shake-impact');
        }

        function renderHabits() {
            container.innerHTML = '';
            const todaysHabits = habits.filter(h => h.days.includes(currentDayName));

            if (todaysHabits.length === 0) {
                container.innerHTML = `<div class="empty-state">🎉 Rest day! Boss cleared on entry.</div>`;
                percentEl.innerText = "100%";
                barEl.style.width = "100%";
                hpBarEl.style.width = "0%";
                hpTextEl.innerText = "HP: 0/100 (DEAD)";
                return;
            }

            let completedCount = 0;

            todaysHabits.forEach(habit => {
                if (habit.completed) completedCount++;

                const item = document.createElement('div');
                item.className = 'habit-item';
                item.innerHTML = `
                    <div class="habit-left" onclick="toggleHabit(${habit.id})">
                        <input type="checkbox" class="habit-checkbox" ${habit.completed ? 'checked' : ''} readonly>
                        <div class="habit-details">
                            <span class="habit-text ${habit.completed ? 'completed' : ''}">${habit.text}</span>
                            <span class="habit-days-badge">🗓️ ${habit.days.join(', ')}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteHabit(${habit.id})">×</button>
                `;
                container.appendChild(item);
            });

            const finalPercentage = Math.round((completedCount / todaysHabits.length) * 100);
            percentEl.innerText = `${finalPercentage}%`;
            barEl.style.width = `${finalPercentage}%`;

            // Calculate Inverse Damage for Boss HP Bar
            const bossHP = 100 - finalPercentage;
            hpBarEl.style.width = `${bossHP}%`;
            hpTextEl.innerText = bossHP === 0 ? "HP: 0/100 (DEAD)" : `HP: ${bossHP}/100`;

            if (finalPercentage === 100 && todaysHabits.length > 0) {
                confetti({ particleCount: 30, spread: 25, origin: { y: 0.85 } });
            }
        }

        function toggleHabit(id) {
            habits = habits.map(h => h.id === id ? { ...h, completed: !h.completed } : h);
            triggerImpactAnimation();
            saveAndRender();
        }

        function addHabit() {
            const text = inputEl.value.trim();
            if (!text) return;

            const checkedDays = [];
            document.querySelectorAll('.week-selector input').forEach(box => {
                if (box.checked) checkedDays.push(box.value);
            });

            if (checkedDays.length === 0) {
                alert("Select at least one day!");
                return;
            }

            habits.push({ id: Date.now(), text: text, completed: false, days: checkedDays });
            inputEl.value = '';
            saveAndRender();
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveAndRender();
        }

        function logCurrentDay() {
            const todayKey = new Date().toISOString().split('T')[0];
            const selectedStatus = ratingSelect.value;
            const textStatus = ratingSelect.options[ratingSelect.selectedIndex].text;
            const todaysHabits = habits.filter(h => h.days.includes(currentDayName));
            const completedCount = habits.filter(h => h.days.includes(currentDayName) && h.completed).length;
            const score = todaysHabits.length > 0 ? Math.round((completedCount / todaysHabits.length) * 100) : 100;

            historyLogs[todayKey] = {
                status: selectedStatus,
                statusLabel: textStatus,
                completionScore: score
            };

            localStorage.setItem('dashboard_history_v1', JSON.stringify(historyLogs));
            
            confetti({ particleCount: 40, angle: 60, spread: 55, origin: { x: 0 } });
            confetti({ particleCount: 40, angle: 120, spread: 55, origin: { x: 1 } });
            
            alert(`Logged: "${textStatus}"`);
        }

        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addHabit();
        });

        renderHabits();
    </script>
</body>
</html>
