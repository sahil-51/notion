<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Habit Matrix - Analytics Edition</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
    
    <style>
        :root {
            --bg-color: #ffffff; 
            --card-bg: #fbfbfa;   
            --border-color: #e9e9e6;
            --text-main: #37352f; 
            --text-sub: #787774;  
            --accent-color: #4a5568; 
            --progress-empty: #e9e9e6;
            --progress-filled: #2a9d8f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(74, 85, 104, 0.03);
            width: 100%;
            max-width: 340px;
            box-sizing: border-box;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-sub);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #e9e9e6;
            color: var(--text-main);
        }

        /* View Toggling Visibility States */
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        .day-indicator {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .progress-zone {
            margin-bottom: 12px;
        }

        .percentage {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -1px;
        }

        .bar-bg {
            background: var(--progress-empty);
            border-radius: 10px;
            height: 6px;
            width: 100%;
            overflow: hidden;
        }

        .bar-fill {
            background: var(--progress-filled);
            height: 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .rating-zone {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rating-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .rating-row {
            display: flex;
            gap: 6px;
        }

        .rating-select {
            flex: 1;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        .log-day-btn {
            background-color: var(--progress-filled);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        .habit-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 2px;
        }

        .habit-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .habit-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .habit-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--progress-filled);
            flex-shrink: 0;
        }

        .habit-details {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .habit-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .habit-text.completed {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .habit-days-badge {
            font-size: 0.65rem;
            color: var(--text-sub);
            margin-top: 1px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #eb5757;
            font-weight: 800;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .add-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 12px;
        }

        .add-panel {
            display: flex;
            gap: 6px;
        }

        .add-input {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            outline: none;
            color: var(--text-main);
            min-width: 0;
        }

        .add-btn {
            background-color: var(--text-main);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 0 12px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .week-selector {
            display: flex;
            justify-content: space-between;
            gap: 2px;
        }

        .day-checkbox-label {
            flex: 1;
            text-align: center;
        }

        .day-checkbox-label input {
            display: none;
        }

        .day-box {
            display: block;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-sub);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 5px 0;
            border-radius: 4px;
            user-select: none;
        }

        .day-checkbox-label input:checked + .day-box {
            background-color: var(--text-main);
            color: #ffffff;
            border-color: var(--text-main);
        }

        /* 📊 MOBILE FIRST CUSTOM ANALYTICS STYLING */
        .chart-wrapper {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .chart-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .bar-chart-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 120px;
            padding: 0 4px;
            margin-bottom: 4px;
        }

        .chart-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .bar-vertical-track {
            background: var(--progress-empty);
            width: 12px;
            height: 90px;
            border-radius: 6px;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
        }

        .bar-vertical-fill {
            background: var(--progress-filled);
            width: 100%;
            height: 0%; /* Dynamic height adjustment */
            border-radius: 6px;
            transition: height 0.5s ease-out;
        }

        .bar-label {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-top: 6px;
        }

        .history-stream-box {
            max-height: 160px;
            overflow-y: auto;
        }

        .history-log-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.78rem;
        }

        .history-log-left {
            font-weight: 600;
            color: var(--text-main);
        }

        .history-log-right {
            font-weight: 700;
            color: var(--progress-filled);
        }

        .empty-state {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-align: center;
            margin: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Unified Navigation Tab Layout -->
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab-combat-btn" onclick="switchTab('combat')">⚔️ Combat</button>
            <button class="tab-btn" id="tab-analytics-btn" onclick="switchTab('analytics')">📊 Analytics</button>
        </div>

        <!-- ⚔️ TAB 1: COMBAT AREA -->
        <div id="section-combat" class="view-section active">
            <div class="day-indicator" id="current-day-label">Loading day...</div>
            
            <div class="progress-zone">
                <div class="percentage" id="progress-percent">0%</div>
                <div class="bar-bg">
                    <div class="bar-fill" id="progress-bar"></div>
                </div>
            </div>

            <div class="rating-zone">
                <div class="rating-label">✨ Aaj ka din kaisa tha?</div>
                <div class="rating-row">
                    <select class="rating-select" id="day-rating-dropdown">
                        <option value="ek-number">⭐ ek number din tha</option>
                        <option value="maaza">🔥 maaza hi agya</option>
                        <option value="thik">👍 thik thik</option>
                        <option value="kharab">👎 kharab</option>
                        <option value="bhul-jana">🌧️ bhul jana hi thik hai</option>
                    </select>
                    <button class="log-day-btn" onclick="logCurrentDay()">Log</button>
                </div>
            </div>

            <div class="habit-list" id="habit-container"></div>

            <div class="add-container">
                <div class="add-panel">
                    <input type="text" class="add-input" id="habit-input" placeholder="New routine..." maxlength="18">
                    <button class="add-btn" onclick="addHabit()">Add</button>
                </div>
                
                <div class="week-selector">
                    <label class="day-checkbox-label"><input type="checkbox" value="Su" checked><span class="day-box">Su</span></label>
                    <label class="day-checkbox-label"><input type="checkbox" value="Mo" checked><span class="day-box">Mo</span></label>
                    <label class="day-checkbox-label"><input type="checkbox" value="Tu" checked><span class="day-box">Tu</span></label>
                    <label class="day-checkbox-label"><input type="checkbox" value="We" checked><span class="day-box">We</span></label>
                    <label class="day-checkbox-label"><input type="checkbox" value="Th" checked><span class="day-box">Th</span></label>
                    <label class="day-checkbox-label"><input type="checkbox" value="Fr" checked><span class="day-box">Fr</span></label>
                    <label class="day-checkbox-label"><input type="checkbox" value="Sa" checked><span class="day-box">Sa</span></label>
                </div>
            </div>
        </div>

        <!-- 📊 TAB 2: ANALYTICS AREA -->
        <div id="section-analytics" class="view-section">
            <div class="chart-wrapper">
                <div class="chart-title">Weekly Performance (%)</div>
                <div class="bar-chart-container">
                    <div class="chart-column"><div class="bar-vertical-track"><div class="bar-vertical-fill" id="bar-Su"></div></div><span class="bar-label">Su</span></div>
                    <div class="chart-column"><div class="bar-vertical-track"><div class="bar-vertical-fill" id="bar-Mo"></div></div><span class="bar-label">Mo</span></div>
                    <div class="chart-column"><div class="bar-vertical-track"><div class="bar-vertical-fill" id="bar-Tu"></div></div><span class="bar-label">Tu</span></div>
                    <div class="chart-column"><div class="bar-vertical-track"><div class="bar-vertical-fill" id="bar-We"></div></div><span class="bar-label">We</span></div>
                    <div class="chart-column"><div class="bar-vertical-track"><div class="bar-vertical-fill" id="bar-Th"></div></div><span class="bar-label">Th</span></div>
                    <div class="chart-column"><div class="bar-vertical-track"><div class="bar-vertical-fill" id="bar-Fr"></div></div><span class="bar-label">Fr</span></div>
                    <div class="chart-column"><div class="bar-vertical-track"><div class="bar-vertical-fill" id="bar-Sa"></div></div><span class="bar-label">Sa</span></div>
                </div>
            </div>

            <div class="day-indicator">📋 History Review Logs</div>
            <div class="history-stream-box" id="history-rows-container"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const dayNames = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
        const fullDayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        
        const currentDayIndex = new Date().getDay();
        const currentDayName = dayNames[currentDayIndex];
        
        document.getElementById('current-day-label').innerText = `📅 ${fullDayNames[currentDayIndex]}`;

        let habits = JSON.parse(localStorage.getItem('dashboard_habits_mobile_v1')) || [];
        let historyLogs = JSON.parse(localStorage.getItem('dashboard_history_v1')) || {};

        const container = document.getElementById('habit-container');
        const percentEl = document.getElementById('progress-percent');
        const barEl = document.getElementById('progress-bar');
        const inputEl = document.getElementById('habit-input');
        const ratingSelect = document.getElementById('day-rating-dropdown');
        const historyContainer = document.getElementById('history-rows-container');

        // Tab Switching Router Mechanics
        function switchTab(targetTab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));

            if (targetTab === 'combat') {
                document.getElementById('tab-combat-btn').classList.add('active');
                document.getElementById('section-combat').classList.add('active');
                renderHabits();
            } else {
                document.getElementById('tab-analytics-btn').classList.add('active');
                document.getElementById('section-analytics').classList.add('active');
                renderAnalytics();
            }
        }

        function saveAndRender() {
            localStorage.setItem('dashboard_habits_mobile_v1', JSON.stringify(habits));
            renderHabits();
        }

        function renderHabits() {
            container.innerHTML = '';
            const todaysHabits = habits.filter(h => h.days.includes(currentDayName));

            if (todaysHabits.length === 0) {
                container.innerHTML = `<div class="empty-state">🎉 Rest day! No habits scheduled.</div>`;
                percentEl.innerText = "100%";
                barEl.style.width = "100%";
                return;
            }

            let completedCount = 0;
            todaysHabits.forEach(habit => {
                if (habit.completed) completedCount++;

                const item = document.createElement('div');
                item.className = 'habit-item';
                item.innerHTML = `
                    <div class="habit-left" onclick="toggleHabit(${habit.id})">
                        <input type="checkbox" class="habit-checkbox" ${habit.completed ? 'checked' : ''} readonly>
                        <div class="habit-details">
                            <span class="habit-text ${habit.completed ? 'completed' : ''}">${habit.text}</span>
                            <span class="habit-days-badge">🗓️ ${habit.days.join(', ')}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteHabit(${habit.id})">×</button>
                `;
                container.appendChild(item);
            });

            const finalPercentage = Math.round((completedCount / todaysHabits.length) * 100);
            percentEl.innerText = `${finalPercentage}%`;
            barEl.style.width = `${finalPercentage}%`;

            if (finalPercentage === 100 && todaysHabits.length > 0) {
                confetti({ particleCount: 20, spread: 20, origin: { y: 0.85 } });
            }
        }

        function toggleHabit(id) {
            habits = habits.map(h => h.id === id ? { ...h, completed: !h.completed } : h);
            saveAndRender();
        }

        function addHabit() {
            const text = inputEl.value.trim();
            if (!text) return;

            const checkedDays = [];
            document.querySelectorAll('.week-selector input').forEach(box => {
                if (box.checked) checkedDays.push(box.value);
            });

            if (checkedDays.length === 0) {
                alert("Select at least one day!");
                return;
            }

            habits.push({ id: Date.now(), text: text, completed: false, days: checkedDays });
            inputEl.value = '';
            saveAndRender();
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveAndRender();
        }

        function logCurrentDay() {
            const todayObj = new Date();
            const todayKey = todayObj.toISOString().split('T')[0];
            const selectedStatus = ratingSelect.value;
            const textStatus = ratingSelect.options[ratingSelect.selectedIndex].text;
            
            // Get day index (0-6) and map to string label representation
            const dayStr = dayNames[todayObj.getDay()];

            const todaysHabits = habits.filter(h => h.days.includes(currentDayName));
            const completedCount = habits.filter(h => h.days.includes(currentDayName) && h.completed).length;
            const score = todaysHabits.length > 0 ? Math.round((completedCount / todaysHabits.length) * 100) : 100;

            historyLogs[todayKey] = {
                status: selectedStatus,
                statusLabel: textStatus,
                completionScore: score,
                dayLabel: dayStr
            };

            localStorage.setItem('dashboard_history_v1', JSON.stringify(historyLogs));
            
            confetti({ particleCount: 30, angle: 60, spread: 45, origin: { x: 0 } });
            confetti({ particleCount: 30, angle: 120, spread: 45, origin: { x: 1 } });
            
            alert(`Logged: "${textStatus}"`);
        }

        // 📊 ANALYTICS COMPILATION RENDER LOGIC
        function renderAnalytics() {
            historyContainer.innerHTML = '';
            
            // 1. Clear out graph rendering tracks first
            dayNames.forEach(day => {
                document.getElementById(`bar-${day}`).style.height = "0%";
            });

            const sortedLogKeys = Object.keys(historyLogs).sort().reverse(); // Sort newest logs first

            if (sortedLogKeys.length === 0) {
                historyContainer.innerHTML = `<div class="empty-state">No historical data found. Hit "Log" on your combat view!</div>`;
                return;
            }

            // 2. Plot graph scores dynamically from saved keys
            sortedLogKeys.forEach((key, index) => {
                const item = historyLogs[key];
                
                // Update graph height bar if logged within the running chart frame
                if (item.dayLabel) {
                    const barFillEl = document.getElementById(`bar-${item.dayLabel}`);
                    if (barFillEl) {
                        barFillEl.style.height = `${item.completionScore}%`;
                    }
                }

                // 3. Construct chronological scrolling table row list below graph
                const logRow = document.createElement('div');
                logRow.className = 'history-log-row';
                logRow.innerHTML = `
                    <div class="history-log-left">
                        <span>${key.substring(5)} (${item.dayLabel || 'Day'})</span>
                        <div style="font-size:0.7rem; color:var(--text-sub); font-weight:normal; margin-top:2px;">${item.statusLabel}</div>
                    </div>
                    <div class="history-log-right">${item.completionScore}%</div>
                `;
                historyContainer.appendChild(logRow);
            });
        }

        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addHabit();
        });

        renderHabits();
    </script>
</body>
</html>
