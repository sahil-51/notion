<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Anime Streak Tracker (With High Score)</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght=400;600;800&display=swap">
    
    <style>
        :root {
            --bg-color: #ffffff; /* Notion Light Mode */
            --card-bg: #fbfbfa;   
            --border-color: #e9e9e6;
            --text-main: #37352f; 
            --text-sub: #787774;  
            --accent-color: #4a5568; 
            --glow-color: rgba(74, 85, 104, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px 45px;
            text-align: center;
            box-shadow: 0 10px 30px var(--glow-color);
            transition: all 0.5s ease;
            width: 230px;
            position: relative;
        }

        /* Highest Streak Badge Styling */
        .highest-badge {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            background-color: #e9e9e6;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }

        h3 {
            margin: 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-sub);
        }

        .count {
            font-size: 5rem;
            font-weight: 800;
            margin: 5px 0;
            color: var(--accent-color);
            transition: all 0.4s ease;
        }

        .tier {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 22px;
            color: var(--accent-color);
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 13px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(0.9); 
        }

        .msg {
            font-size: 0.75rem;
            color: #d97300; 
            margin-top: 12px;
            font-weight: 600;
        }

        #confetti {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        /* ========================================================
           DYNAMIC TEXT EFFECTS LOCK ON NUMBERS
        ======================================================== */
        .count-saiyan {
            animation: textFlame 1.2s infinite alternate ease-in-out;
        }

        @keyframes textFlame {
            0% { text-shadow: 0 0 10px #ffcc00, 0 -2px 15px #ff8800, 0 -4px 25px #ff3300; }
            100% { text-shadow: 0 0 14px #ffcc00, 0 -4px 22px #ffaa00, 0 -8px 35px #ff5500; transform: scale(1.03); }
        }

        .count-royal {
            animation: royalShimmer 2s infinite ease-in-out;
        }

        @keyframes royalShimmer {
            0%, 100% { text-shadow: 0 0 8px #e0aaff, 0 0 20px #7b2cbf; }
            50% { text-shadow: 0 0 15px #ffffff, 0 0 30px #9d4edd; transform: translateY(-2px); }
        }

        .count-frozen {
            color: #64b5f6 !important; 
            text-shadow: 0 4px 10px rgba(100, 181, 246, 0.6), 0 0 20px #e3f2fd;
            animation: freezeShiver 0.5s ease-in-out;
        }

        @keyframes freezeShiver {
            0%, 100% { transform: translate(0, 0); }
            10%, 50%, 90% { transform: translate(-3px, 1px); }
            30%, 70% { transform: translate(3px, -1px); }
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <div class="card" id="main-card">
        <!-- New Highest Streak Display Element -->
        <div class="highest-badge">👑 Max Streak: <span id="highest-counter">0</span></div>
        
        <h3>Streak</h3>
        <div class="count" id="counter">0</div>
        <div class="tier" id="tier-label">🌱 Beginner</div>
        <button id="checkin-btn" onclick="checkIn()">Complete Today</button>
        <div class="msg" id="status-msg">Testing Mode: Click away!</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        let streak = parseInt(localStorage.getItem('habit_streak')) || 0;
        let highestStreak = parseInt(localStorage.getItem('highest_streak')) || 0;
        let lastCheckIn = localStorage.getItem('last_check_in') || null;

        const counterEl = document.getElementById('counter');
        const highestEl = document.getElementById('highest-counter');
        const tierEl = document.getElementById('tier-label');
        const buttonEl = document.getElementById('checkin-btn');
        const statusEl = document.getElementById('status-msg');
        const root = document.documentElement;

        function checkStreakValidity() {
            if (!lastCheckIn) return;

            const today = new Date();
            const lastDate = new Date(lastCheckIn);

            today.setHours(0,0,0,0);
            lastDate.setHours(0,0,0,0);

            const diffTime = today - lastDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 1) {
                streak = 0;
                localStorage.setItem('habit_streak', 0);
                triggerFreezeReset();
            }
        }

        function triggerFreezeReset() {
            counterEl.className = "count count-frozen"; 
            const originalText = statusEl.innerText;
            statusEl.innerText = "🥶 Broken timeline! Numbers freezing...";
            
            setTimeout(() => {
                updateVisuals(); 
                statusEl.innerText = originalText;
            }, 1500);
        }

        function updateVisuals() {
            counterEl.innerText = streak;
            highestEl.innerText = highestStreak; // Render the updated all-time high score
            counterEl.className = "count"; 

            /* RAPID TESTING MILESTONES SCALE */
            if (streak >= 14) {
                root.style.setProperty('--accent-color', '#1a002c'); 
                root.style.setProperty('--glow-color', 'rgba(26, 0, 44, 0.2)');
                tierEl.innerText = "🌌 destroyer of world 🔥";
            } else if (streak >= 12) {
                root.style.setProperty('--accent-color', '#411d73'); 
                tierEl.innerText = "👑 Immortal King";
                counterEl.classList.add('count-royal'); 
            } else if (streak >= 10) {
                root.style.setProperty('--accent-color', '#9e0018'); 
                root.style.setProperty('--glow-color', 'rgba(158, 0, 24, 0.2)');
                tierEl.innerText = "🗡️💥 Berserker";
            } else if (streak >= 8) {
                root.style.setProperty('--accent-color', '#cc9a06'); 
                tierEl.innerText = "🌀⚡ Super Saiyan level";
                counterEl.classList.add('count-saiyan'); 
            } else if (streak >= 6) {
                root.style.setProperty('--accent-color', '#1b4332'); 
                root.style.setProperty('--glow-color', 'rgba(27, 67, 50, 0.15)');
                tierEl.innerText = "🏆 Champion";
            } else if (streak >= 4) {
                root.style.setProperty('--accent-color', '#023e8a'); 
                root.style.setProperty('--glow-color', 'rgba(2, 62, 138, 0.15)');
                tierEl.innerText = "⚔️ Challenger";
            } else if (streak >= 2) {
                root.style.setProperty('--accent-color', '#2a9d8f'); 
                root.style.setProperty('--glow-color', 'rgba(42, 157, 143, 0.15)');
                tierEl.innerText = "🗺️ Explorer";
            } else {
                root.style.setProperty('--accent-color', '#4a5568'); 
                root.style.setProperty('--glow-color', 'rgba(74, 85, 104, 0.1)');
                tierEl.innerText = "🌱 Beginner";
            }
        }

        function checkIn() {
            streak++;
            lastCheckIn = new Date().toISOString();

            // High Score Tracker Logic
            if (streak > highestStreak) {
                highestStreak = streak;
                localStorage.setItem('highest_streak', highestStreak);
            }

            localStorage.setItem('habit_streak', streak);
            localStorage.setItem('last_check_in', lastCheckIn);

            updateVisuals();

            confetti({
                particleCount: 80,
                spread: 50,
                origin: { y: 0.75 },
                colors: [getComputedStyle(root).getPropertyValue('--accent-color').trim(), '#ffffff']
            });
        }

        checkStreakValidity();
        updateVisuals();
    </script>
</body>
</html>
