<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Streak Tracker (Custom Tiers - Testing)</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    
    <style>
        :root {
            --bg-color: #ffffff; /* Notion Light Mode */
            --card-bg: #fbfbfa;   
            --border-color: #e9e9e6;
            --text-main: #37352f; 
            --text-sub: #787774;  
            --accent-color: #6c757d; 
            --glow-color: rgba(108, 117, 125, 0.15);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px 40px;
            text-align: center;
            box-shadow: 0 8px 24px var(--glow-color);
            transition: all 0.5s ease;
            width: 230px;
        }

        h3 {
            margin: 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-sub);
        }

        .count {
            font-size: 4.5rem;
            font-weight: 800;
            margin: 10px 0;
            color: var(--accent-color);
            text-shadow: 0 2px 10px var(--glow-color);
            transition: all 0.5s ease;
        }

        .tier {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-transform: uppercase;
            transition: all 0.5s ease;
        }

        button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px var(--glow-color);
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(0.9); 
        }

        .msg {
            font-size: 0.75rem;
            color: #d97300; 
            margin-top: 10px;
            font-weight: 600;
        }

        #confetti {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <div class="card" id="main-card">
        <h3>Streak</h3>
        <div class="count" id="counter">0</div>
        <div class="tier" id="tier-label">🌱 Beginner</div>
        <button id="checkin-btn" onclick="checkIn()">Complete Today</button>
        <div class="msg" id="status-msg">Testing Mode: Click away!</div>
    </div>

    <!-- Canvas Confetti Library Script -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        let streak = parseInt(localStorage.getItem('habit_streak')) || 0;
        let lastCheckIn = localStorage.getItem('last_check_in') || null;

        const counterEl = document.getElementById('counter');
        const tierEl = document.getElementById('tier-label');
        const buttonEl = document.getElementById('checkin-btn');
        const statusEl = document.getElementById('status-msg');
        const root = document.documentElement;

        function checkStreakValidity() {
            if (!lastCheckIn) return;

            const today = new Date();
            const lastDate = new Date(lastCheckIn);

            today.setHours(0,0,0,0);
            lastDate.setHours(0,0,0,0);

            const diffTime = today - lastDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            // Automatically resets if you take a break during production,
            // but left open right now for seamless manual multi-clicking testing.
            if (diffDays > 1) {
                streak = 0;
                localStorage.setItem('habit_streak', 0);
            }
        }

        function updateVisuals() {
            counterEl.innerText = streak;

            /* RAPID TESTING MILESTONES SCALE */
            if (streak >= 14) {
                // 8. Destroyer of World
                root.style.setProperty('--accent-color', '#f72585'); 
                root.style.setProperty('--glow-color', 'rgba(247, 37, 133, 0.2)');
                tierEl.innerText = "🌌 Destroyer of World 🔥";
            } else if (streak >= 12) {
                // 7. Immortal King
                root.style.setProperty('--accent-color', '#7209b7'); 
                root.style.setProperty('--glow-color', 'rgba(114, 9, 183, 0.15)');
                tierEl.innerText = "👑 Immortal King";
            } else if (streak >= 10) {
                // 6. Berserker
                root.style.setProperty('--accent-color', '#ff4d6d'); 
                root.style.setProperty('--glow-color', 'rgba(255, 77, 109, 0.2)');
                tierEl.innerText = "🗡️💥 Berserker";
            } else if (streak >= 8) {
                // 5. Super Saiyan level
                root.style.setProperty('--accent-color', '#ffb703'); 
                root.style.setProperty('--glow-color', 'rgba(255, 183, 3, 0.25)');
                tierEl.innerText = "🌀⚡ Super Saiyan level";
            } else if (streak >= 6) {
                // 4. Champion
                root.style.setProperty('--accent-color', '#70e000'); 
                root.style.setProperty('--glow-color', 'rgba(112, 224, 0, 0.15)');
                tierEl.innerText = "🏆 Champion";
            } else if (streak >= 4) {
                // 3. Challenger
                root.style.setProperty('--accent-color', '#0077b6'); 
                root.style.setProperty('--glow-color', 'rgba(0, 119, 182, 0.15)');
                tierEl.innerText = "⚔️ Challenger";
            } else if (streak >= 2) {
                // 2. Explorer
                root.style.setProperty('--accent-color', '#00b4d8'); 
                root.style.setProperty('--glow-color', 'rgba(0, 180, 216, 0.15)');
                tierEl.innerText = "🗺️ Explorer";
            } else {
                // 1. Beginner
                root.style.setProperty('--accent-color', '#5f6c7d'); 
                root.style.setProperty('--glow-color', 'rgba(95, 108, 125, 0.1)');
                tierEl.innerText = "🌱 Beginner";
            }
        }

        function checkIn() {
            streak++;
            lastCheckIn = new Date().toISOString();

            localStorage.setItem('habit_streak', streak);
            localStorage.setItem('last_check_in', lastCheckIn);

            updateVisuals();

            // Fire confetti styled after your current tier power color!
            confetti({
                particleCount: 80,
                spread: 50,
                origin: { y: 0.75 },
                colors: [getComputedStyle(root).getPropertyValue('--accent-color').trim(), '#37352f']
            });
        }

        checkStreakValidity();
        updateVisuals();
    </script>
</body>
</html>
