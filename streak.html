<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Anime Streak Tracker (Testing Mode)</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    
    <style>
        :root {
            --bg-color: #ffffff; /* Notion Light Mode */
            --card-bg: #fbfbfa;   
            --border-color: #e9e9e6;
            --text-main: #37352f; 
            --text-sub: #787774;  
            --accent-color: #4a5568; 
            --glow-color: rgba(74, 85, 104, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card-container {
            position: relative;
            padding: 15px;
        }

        /* Core card design */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px 45px;
            text-align: center;
            box-shadow: 0 10px 30px var(--glow-color);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 230px;
            position: relative;
            z-index: 2;
        }

        h3 {
            margin: 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-sub);
        }

        .count {
            font-size: 4.8rem;
            font-weight: 800;
            margin: 8px 0;
            color: var(--accent-color);
            text-shadow: 0 2px 12px var(--glow-color);
            transition: all 0.5s ease;
        }

        .tier {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 22px;
            color: var(--accent-color);
            text-transform: uppercase;
            transition: all 0.5s ease;
        }

        button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 13px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px var(--glow-color);
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(0.9); 
        }

        .msg {
            font-size: 0.75rem;
            color: #d97300; /* Orange warning for test mode */
            margin-top: 12px;
            font-weight: 600;
        }

        #confetti {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        /* ========================================================
           CINEMATIC ANIMATION AURA CODES
        ======================================================== */

        /* 1. Super Saiyan Fireball Aura Backdrop */
        .saiyan-aura {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            z-index: 1;
            pointer-events: none;
            box-shadow: 0 0 40px 15px #ffcc00, 0 0 70px 30px #ff6600;
            opacity: 0.25;
            animation: flameAura 1.5s infinite alternate ease-in-out;
        }

        @keyframes flameAura {
            0% { transform: scale(0.96) skewX(-1deg); filter: blur(4px); }
            100% { transform: scale(1.04) skewX(1deg); filter: blur(8px); }
        }

        /* 2. Immortal King Royal Sparkle Background */
        .royal-aura {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            z-index: 1;
            pointer-events: none;
            box-shadow: 0 0 35px 10px #7b2cbf, 0 0 60px 20px #e0aaff;
            opacity: 0.2;
            animation: royalPulse 2s infinite ease-in-out;
        }

        @keyframes royalPulse {
            0%, 100% { transform: scale(0.98); opacity: 0.15; }
            50% { transform: scale(1.02); opacity: 0.3; }
        }

        /* 3. Freeze Reset Shake Animation */
        .freeze-effect {
            animation: iceShatter 0.6s ease-in-out;
            background: #f0f8ff !important; 
            border-color: #add8e6 !important;
        }

        @keyframes iceShatter {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-6px) rotate(-1deg); }
            20%, 40%, 60%, 80% { transform: translateX(6px) rotate(1deg); }
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <div class="card-container">
        <div id="aura-layer"></div>
        
        <div class="card" id="main-card">
            <h3>Streak</h3>
            <div class="count" id="counter">0</div>
            <div class="tier" id="tier-label">🌱 Beginner</div>
            <button id="checkin-btn" onclick="checkIn()">Complete Today</button>
            <div class="msg" id="status-msg">Testing Mode: Click away!</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        let streak = parseInt(localStorage.getItem('habit_streak')) || 0;
        let lastCheckIn = localStorage.getItem('last_check_in') || null;

        const cardEl = document.getElementById('main-card');
        const auraEl = document.getElementById('aura-layer');
        const counterEl = document.getElementById('counter');
        const tierEl = document.getElementById('tier-label');
        const buttonEl = document.getElementById('checkin-btn');
        const statusEl = document.getElementById('status-msg');
        const root = document.documentElement;

        function checkStreakValidity() {
            if (!lastCheckIn) return;

            const today = new Date();
            const lastDate = new Date(lastCheckIn);

            today.setHours(0,0,0,0);
            lastDate.setHours(0,0,0,0);

            const diffTime = today - lastDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            // If a day was missed, trigger the freeze animation on load
            if (diffDays > 1) {
                streak = 0;
                localStorage.setItem('habit_streak', 0);
                triggerFreezeReset();
            }
        }

        function triggerFreezeReset() {
            cardEl.classList.add('freeze-effect');
            const originalText = statusEl.innerText;
            statusEl.innerText = "🥶 Streak frozen! Resetting metrics...";
            
            setTimeout(() => {
                cardEl.classList.remove('freeze-effect');
                statusEl.innerText = originalText;
            }, 1500);
        }

        function updateVisuals() {
            counterEl.innerText = streak;
            auraEl.className = ""; // Reset aura background layer

            /* RAPID TESTING MILESTONES SCALE */
            if (streak >= 14) {
                // 8. Destroyer of World
                root.style.setProperty('--accent-color', '#1a002c'); 
                root.style.setProperty('--glow-color', 'rgba(26, 0, 44, 0.2)');
                tierEl.innerText = "🌌 destroyer of world 🔥";
            } else if (streak >= 12) {
                // 7. Immortal King
                root.style.setProperty('--accent-color', '#411d73'); 
                root.style.setProperty('--glow-color', 'rgba(65, 29, 115, 0.15)');
                tierEl.innerText = "👑 Immortal King";
                auraEl.className = "royal-aura"; // Triggers Sovereign Sparkle aura
            } else if (streak >= 10) {
                // 6. Berserker
                root.style.setProperty('--accent-color', '#9e0018'); 
                root.style.setProperty('--glow-color', 'rgba(158, 0, 24, 0.2)');
                tierEl.innerText = "🗡️💥 Berserker";
            } else if (streak >= 8) {
                // 5. Super Saiyan level
                root.style.setProperty('--accent-color', '#e6a100'); 
                root.style.setProperty('--glow-color', 'rgba(230, 161, 0, 0.25)');
                tierEl.innerText = "🌀⚡ Super Saiyan level";
                auraEl.className = "saiyan-aura"; // Triggers Dragon Ball style Fireball aura
            } else if (streak >= 6) {
                // 4. Champion
                root.style.setProperty('--accent-color', '#1b4332'); 
                root.style.setProperty('--glow-color', 'rgba(27, 67, 50, 0.15)');
                tierEl.innerText = "🏆 Champion";
            } else if (streak >= 4) {
                // 3. Challenger
                root.style.setProperty('--accent-color', '#023e8a'); 
                root.style.setProperty('--glow-color', 'rgba(2, 62, 138, 0.15)');
                tierEl.innerText = "⚔️ Challenger";
            } else if (streak >= 2) {
                // 2. Explorer
                root.style.setProperty('--accent-color', '#2a9d8f'); 
                root.style.setProperty('--glow-color', 'rgba(42, 157, 143, 0.15)');
                tierEl.innerText = "🗺️ Explorer";
            } else {
                // 1. Beginner
                root.style.setProperty('--accent-color', '#4a5568'); 
                root.style.setProperty('--glow-color', 'rgba(74, 85, 104, 0.1)');
                tierEl.innerText = "🌱 Beginner";
            }
        }

        function checkIn() {
            streak++;
            lastCheckIn = new Date().toISOString();

            localStorage.setItem('habit_streak', streak);
            localStorage.setItem('last_check_in', lastCheckIn);

            updateVisuals();

            // Fire custom colored confetti
            confetti({
                particleCount: 80,
                spread: 50,
                origin: { y: 0.75 },
                colors: [getComputedStyle(root).getPropertyValue('--accent-color').trim(), '#ffffff']
            });
        }

        checkStreakValidity();
        updateVisuals();
    </script>
</body>
</html>
